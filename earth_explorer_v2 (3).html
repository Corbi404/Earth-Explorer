<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Earth Explorer</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    :root { --bg:#101820; --panel:#172631; --line:#304451; --txt:#f4f7fb; --mut:#b9cbd5; --acc:#2388ff; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--txt); }
    body { display: flex; flex-direction: column; }
    header { position: relative; z-index: 1200; display: flex; gap: 8px; align-items: center; padding: 8px 10px; background: var(--panel); border-bottom: 1px solid var(--line); }
    .brand { font-size: 22px; }
    #searchForm { flex: 1; display: flex; gap: 6px; }
    #q { flex: 1; min-width: 0; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: #0e1a22; color: var(--txt); font-size: 16px; }
    .b { border: 0; border-radius: 10px; padding: 9px 12px; background: #24394a; color: var(--txt); font-size: 14px; cursor: pointer; text-decoration: none; display: inline-block; }
    .b.pri { background: var(--acc); }
    .b.on { background: #ff8a00; color: #111; }
    #results { position: absolute; left: 10px; right: 10px; top: 100%; max-height: 50vh; overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 0 0 12px 12px; box-shadow: 0 8px 24px #0008; }
    #results[hidden] { display: none; }
    .res { padding: 11px 12px; border-bottom: 1px solid var(--line); font-size: 14px; cursor: pointer; }
    .res small { display: block; color: var(--mut); margin-top: 2px; }
    #wrap { position: relative; flex: 1; min-height: 0; }
    #map { position: absolute; inset: 0; z-index: 0; background: #dce8ed; }
    .fabs { position: absolute; z-index: 1000; right: 10px; top: 66px; display: flex; flex-direction: column; gap: 8px; }
    .fabs .b { width: 44px; height: 44px; padding: 0; font-size: 20px; background: #fff; color: #172631; box-shadow: 0 2px 10px #0004; }
    .fabs .b.on { background: #ff8a00; }
    #measureChip { position: absolute; z-index: 1000; left: 50%; transform: translateX(-50%); top: 10px; background: #fff; color: #172631; padding: 8px 12px; border-radius: 20px; font-size: 14px; font-weight: 650; box-shadow: 0 2px 10px #0004; display: flex; gap: 10px; align-items: center; }
    #measureChip[hidden] { display: none; }
    #measureChip button { border: 0; background: #e8eef2; border-radius: 12px; padding: 4px 10px; cursor: pointer; }
    #sheet { position: absolute; z-index: 1100; left: 0; right: 0; bottom: 0; height: 46%; display: flex; flex-direction: column; background: var(--panel); border-radius: 16px 16px 0 0; box-shadow: 0 -4px 20px #0006; transition: height .2s; }
    #sheet.min { height: 86px; }
    #grab { padding: 8px 0 4px; cursor: pointer; }
    #grab::after { content: ""; display: block; width: 44px; height: 5px; border-radius: 3px; background: #4b6272; margin: 0 auto; }
    #tabs { display: flex; gap: 6px; padding: 0 10px 8px; }
    #tabs .b { flex: 1; padding: 8px 4px; }
    #tabs .b.on { background: var(--acc); color: #fff; }
    #panel { flex: 1; overflow: auto; padding: 4px 12px 24px; -webkit-overflow-scrolling: touch; }
    .tab[hidden] { display: none; }
    #status { font-size: 13px; color: var(--mut); margin-bottom: 6px; }
    #wx { font-size: 13px; color: var(--txt); margin-bottom: 8px; }
    #chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; }
    .chip { flex: none; border: 1px solid var(--line); background: transparent; color: var(--txt); border-radius: 18px; padding: 7px 12px; font-size: 13px; cursor: pointer; white-space: nowrap; }
    .chip.on { background: var(--acc); border-color: var(--acc); }
    .item { display: flex; gap: 10px; align-items: center; padding: 10px 4px; border-bottom: 1px solid var(--line); cursor: pointer; }
    .item .em { font-size: 22px; width: 34px; text-align: center; }
    .item .nm { font-weight: 650; font-size: 15px; }
    .item .sm { font-size: 12px; color: var(--mut); }
    .item .sm::first-letter, .sub::first-letter { text-transform: uppercase; }
    .empty { color: var(--mut); font-size: 14px; padding: 14px 4px; }
    .ph h2 { margin: 4px 0 2px; font-size: 19px; }
    .sub { color: var(--mut); font-size: 13px; }
    .actions { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; }
    .gallery { display: flex; gap: 6px; overflow-x: auto; }
    .gallery img { height: 130px; border-radius: 10px; flex: none; }
    .credit { font-size: 11px; color: var(--mut); margin: 4px 0 8px; }
    .box { background: #0e1a22; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin: 10px 0; font-size: 14px; line-height: 1.4; }
    .box a { color: #7db7ff; }
    .info { display: grid; grid-template-columns: 90px 1fr; gap: 6px 10px; font-size: 14px; margin: 10px 0; }
    .info dt { color: var(--mut); } .info dd { margin: 0; word-break: break-word; } .info a { color: #7db7ff; }
    h3 { font-size: 15px; margin: 16px 0 6px; }
    .rev { border-top: 1px solid var(--line); padding: 8px 0; font-size: 14px; }
    .rev .meta { color: var(--mut); font-size: 12px; }
    .stars { color: #ffc233; letter-spacing: 1px; }
    #revForm textarea, #revForm input { width: 100%; margin-top: 6px; padding: 9px 10px; border-radius: 10px; border: 1px solid var(--line); background: #0e1a22; color: var(--txt); font-size: 16px; font-family: inherit; }
    #starPick button { border: 0; background: none; font-size: 28px; color: #4b6272; cursor: pointer; padding: 0 2px; }
    #starPick button.on { color: #ffc233; }
    .pin { width: 30px; height: 30px; border-radius: 50%; background: #fff; border: 2px solid var(--acc); display: flex; align-items: center; justify-content: center; font-size: 16px; box-shadow: 0 1px 6px #0006; }
    .user-dot { width: 18px; height: 18px; border-radius: 50%; background: #2388ff; border: 3px solid white; box-shadow: 0 0 0 7px #2388ff35, 0 1px 5px #0006; }
    .leaflet-popup-content { font-size: 14px; }
    .pop-btns { display: flex; gap: 6px; margin-top: 8px; }
    .pop-btns button { border: 0; border-radius: 8px; padding: 6px 10px; background: #2388ff; color: #fff; cursor: pointer; }
    .leaflet-control-attribution { font-size: 10px !important; }

    /* recommended badges */
    .recTag { display: inline-block; font-size: 11px; font-weight: 650; background: #ffe9a8; color: #5a3d00; border-radius: 10px; padding: 2px 7px; margin-left: 4px; vertical-align: middle; white-space: nowrap; }
    .recTag.big { font-size: 13px; margin: 6px 0 0; padding: 4px 10px; }
    .pin { position: relative; }
    .pin .rec { position: absolute; top: -10px; right: -10px; font-size: 16px; filter: drop-shadow(0 1px 2px #0008); }

    /* welcome tour */
    #tour { position: fixed; inset: 0; z-index: 3000; transition: background .3s; }
    #tour[hidden] { display: none; }
    #tour.hello { background: radial-gradient(circle at 50% 35%, #1d4a66, #08121a 70%); }
    #spot { position: fixed; border-radius: 16px; box-shadow: 0 0 0 9999px rgba(8,14,20,.8); outline: 3px solid #ffd54a; transition: all .35s ease; pointer-events: none; animation: ring 1.4s ease-in-out infinite; }
    @keyframes ring { 0%,100% { outline-offset: 0; outline-color: #ffd54a; } 50% { outline-offset: 6px; outline-color: #fff; } }
    #floaties { position: absolute; inset: 0; overflow: hidden; pointer-events: none; display: none; }
    #tour.hello #floaties { display: block; }
    #floaties span { position: absolute; bottom: -50px; opacity: 0; animation: rise linear infinite; }
    @keyframes rise { 0% { transform: translateY(0) rotate(0); opacity: 0; } 10% { opacity: .9; } 90% { opacity: .9; } 100% { transform: translateY(-110vh) rotate(40deg); opacity: 0; } }
    #tourCard { position: absolute; left: 50%; transform: translateX(-50%); width: min(92vw, 360px); background: var(--panel); border: 1px solid var(--line); border-radius: 20px; padding: 18px 18px 14px; text-align: center; box-shadow: 0 12px 40px #000a; }
    #tourCard.center { top: 50%; transform: translate(-50%, -50%); }
    #tourCard.at-top { top: 76px; }
    #tourCard.at-bottom { bottom: 24px; }
    #tourBody { animation: bodyIn .4s ease both; }
    @keyframes bodyIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    .tt { font-size: 30px; margin: 6px 0 8px; }
    #tour:not(.hello) .tt { font-size: 21px; }
    .ltr { display: inline-block; opacity: 0; animation: ltr .5s cubic-bezier(.3,1.6,.5,1) forwards; }
    @keyframes ltr { from { opacity: 0; transform: translateY(16px) scale(.5); } to { opacity: 1; transform: none; } }
    .wave { display: inline-block; transform-origin: 70% 70%; animation: wave 1.6s ease-in-out .7s infinite; }
    @keyframes wave { 0%,60%,100% { transform: rotate(0); } 10% { transform: rotate(14deg); } 20% { transform: rotate(-8deg); } 30% { transform: rotate(14deg); } 40% { transform: rotate(-4deg); } 50% { transform: rotate(10deg); } }
    .bounceE { display: inline-block; animation: bob 1.2s ease-in-out infinite; }
    @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    .stepEm { width: 64px; height: 64px; margin: 0 auto 6px; border-radius: 50%; background: #24394a; display: flex; align-items: center; justify-content: center; font-size: 32px; animation: bob 1.6s ease-in-out infinite; }
    #tourCard p { color: var(--mut); font-size: 15px; line-height: 1.45; margin: 0 0 12px; }
    .sample { display: flex; align-items: center; gap: 10px; background: #0e1a22; border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; margin: 0 0 12px; text-align: left; font-size: 14px; font-weight: 650; }
    #dots { display: flex; justify-content: center; gap: 6px; margin: 4px 0 12px; }
    #dots i { width: 7px; height: 7px; border-radius: 50%; background: #4b6272; transition: width .2s; }
    #dots i.on { background: #ffd54a; width: 18px; border-radius: 4px; }
    .tourBtns { display: flex; gap: 8px; }
    .tourBtns .b { flex: 1; padding: 11px; }
    @media (prefers-reduced-motion: reduce) {
      .ltr, .wave, .bounceE, .stepEm, #floaties span, #spot, #tourBody { animation: none !important; }
      .ltr { opacity: 1; }
    }
  </style>
</head>
<body>
  <header>
    <span class="brand">🌍</span>
    <form id="searchForm">
      <input id="q" type="search" placeholder="Search places or addresses" autocomplete="off">
      <button class="b pri" type="submit">Go</button>
    </form>
    <button class="b" id="gear" title="Google API key (optional)">⚙︎</button>
    <button class="b" id="help" title="Replay the tutorial">?</button>
    <div id="results" hidden></div>
  </header>

  <div id="wrap">
    <div id="map" role="application" aria-label="Interactive world map"></div>
    <div class="fabs">
      <button class="b" id="locate" title="My location">◎</button>
      <button class="b" id="measure" title="Measure distance">📏</button>
      <button class="b" id="searchHere" title="Recommend places around map center">🔄</button>
    </div>
    <div id="measureChip" hidden><span id="measureTxt"></span><button id="measureClear">Clear</button></div>

    <section id="sheet">
      <div id="grab" title="Expand / collapse"></div>
      <nav id="tabs">
        <button class="b on" data-tab="explore">Explore</button>
        <button class="b" data-tab="saved">Saved</button>
        <button class="b" data-tab="place">Place</button>
      </nav>
      <div id="panel">
        <div class="tab" id="tab-explore">
          <div id="status">Tap ◎ to find your location and get recommendations.</div>
          <div id="wx"></div>
          <div id="chips"></div>
          <div id="list"></div>
        </div>
        <div class="tab" id="tab-saved" hidden></div>
        <div class="tab" id="tab-place" hidden><div class="empty">Tap a place on the map, in the list, or in search results to see details.</div></div>
      </div>
    </section>
  </div>

  <div id="tour" hidden>
    <div id="spot"></div>
    <div id="floaties"></div>
    <div id="tourCard" class="center">
      <div id="tourBody"></div>
      <div id="dots"></div>
      <div class="tourBtns"><button class="b" id="tourSkip">Skip</button><button class="b pri" id="tourNext">Next</button></div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const $ = s => document.querySelector(s);
    const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const IMP = (navigator.language || '').startsWith('en-US');
    const store = {
      get(k, d) { try { const v = localStorage.getItem('ee_' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
      set(k, v) { try { localStorage.setItem('ee_' + k, JSON.stringify(v)); } catch (e) {} }
    };
    function fmtDist(m) {
      if (IMP) { const ft = m * 3.281; return ft < 500 ? Math.round(ft) + ' ft' : (m / 1609.34).toFixed(1) + ' mi'; }
      return m < 1000 ? Math.round(m) + ' m' : (m / 1000).toFixed(1) + ' km';
    }
    const safeUrl = u => /^https?:\/\//i.test(u) ? u : null;

    /* ---------- Map + layers ---------- */
    const statusEl = $('#status');
    const map = L.map('map', { center: [20, 0], zoom: 2, minZoom: 2, maxZoom: 18, worldCopyJump: true });
    const base = {
      'Streets': L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors' }),
      'Satellite': L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 18, attribution: 'Tiles &copy; Esri' }),
      'Terrain': L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', { maxZoom: 17, attribution: '&copy; OpenTopoMap, OSM contributors' }),
      'Dark': L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { maxZoom: 19, subdomains: 'abcd', attribution: '&copy; OSM contributors &copy; CARTO' })
    };
    base['Streets'].addTo(map);
    L.control.layers(base, null, { position: 'topright' }).addTo(map);

    const placesLayer = L.layerGroup().addTo(map);
    const selLayer = L.layerGroup().addTo(map);
    let positionMarker = null, accuracyCircle = null, watchId = null;
    let userLatLng = null, exploreCenter = null, places = [], cat = 'top', cur = null, firstFix = true;

    const blueDot = L.divIcon({ className: '', html: '<div class="user-dot"></div>', iconSize: [18, 18], iconAnchor: [9, 9] });

    function focusOn(lat, lon, z) {
      const pt = map.project([lat, lon], z);
      const off = $('#sheet').classList.contains('min') ? 0 : $('#sheet').offsetHeight / 2;
      map.flyTo(map.unproject(pt.add([0, off]), z), z);
    }

    /* ---------- Location (original behavior + recommendations) ---------- */
    function showPosition(position, centerMap) {
      const latlng = [position.coords.latitude, position.coords.longitude];
      const accuracy = position.coords.accuracy;
      userLatLng = { lat: latlng[0], lng: latlng[1] };
      if (!positionMarker) {
        positionMarker = L.marker(latlng, { icon: blueDot, zIndexOffset: 1000 }).addTo(map).bindPopup('📍 You are here');
        accuracyCircle = L.circle(latlng, { radius: accuracy, color: '#2388ff', weight: 1, fillColor: '#2388ff', fillOpacity: 0.10 }).addTo(map);
      } else {
        positionMarker.setLatLng(latlng);
        accuracyCircle.setLatLng(latlng).setRadius(accuracy);
      }
      const acc = accuracy >= 1000 ? (accuracy / 1000).toFixed(1) + ' km' : Math.round(accuracy) + ' m';
      statusEl.textContent = 'Location found · accuracy about ' + acc;
      if (centerMap) { focusOn(latlng[0], latlng[1], 15); positionMarker.openPopup(); }
      if (firstFix) {
        firstFix = false;
        exploreCenter = { lat: latlng[0], lng: latlng[1], label: 'you' };
        runExplore();
        loadWeather(latlng[0], latlng[1]);
      }
    }
    function locationError(error) {
      const messages = { 1: 'Location permission denied. Allow it in browser settings.', 2: 'Your device could not determine your location.', 3: 'Location request timed out. Try again.' };
      statusEl.textContent = messages[error.code] || 'Could not get your location.';
    }
    function requestLocation() {
      if (!('geolocation' in navigator)) { statusEl.textContent = 'This browser does not support geolocation.'; return; }
      statusEl.textContent = 'Requesting location permission…';
      navigator.geolocation.getCurrentPosition(position => {
        showPosition(position, true);
        if (watchId === null) {
          watchId = navigator.geolocation.watchPosition(p => showPosition(p, false), locationError, { enableHighAccuracy: true, maximumAge: 5000, timeout: 20000 });
        }
      }, locationError, { enableHighAccuracy: true, maximumAge: 0, timeout: 20000 });
    }
    $('#locate').addEventListener('click', requestLocation);

    /* ---------- Weather (Open-Meteo, no key) ---------- */
    const WX = c => c === 0 ? '☀️' : c <= 2 ? '🌤️' : c === 3 ? '☁️' : c <= 48 ? '🌫️' : c <= 67 ? '🌧️' : c <= 77 ? '❄️' : c <= 82 ? '🌦️' : '⛈️';
    async function loadWeather(lat, lon) {
      try {
        const u = 'https://api.open-meteo.com/v1/forecast?latitude=' + lat + '&longitude=' + lon + '&current=temperature_2m,weather_code,wind_speed_10m&temperature_unit=' + (IMP ? 'fahrenheit' : 'celsius') + '&wind_speed_unit=' + (IMP ? 'mph' : 'kmh');
        const j = await (await fetch(u)).json();
        const c = j.current;
        $('#wx').textContent = WX(c.weather_code) + ' ' + Math.round(c.temperature_2m) + (IMP ? '°F' : '°C') + ' · wind ' + Math.round(c.wind_speed_10m) + (IMP ? ' mph' : ' km/h');
      } catch (e) { $('#wx').textContent = ''; }
    }

    /* ---------- Recommendations (OpenStreetMap via Overpass) ---------- */
    const SEL = {
      food: ['["amenity"~"^(restaurant|fast_food|food_court)$"]'],
      cafe: ['["amenity"~"^(cafe|ice_cream)$"]', '["shop"="bakery"]'],
      bar: ['["amenity"~"^(bar|pub|biergarten)$"]'],
      park: ['["leisure"~"^(park|garden|nature_reserve)$"]'],
      sights: ['["tourism"~"^(attraction|museum|gallery|viewpoint|zoo|theme_park|aquarium)$"]', '["historic"~"^(monument|memorial|castle|ruins)$"]'],
      shop: ['["shop"~"^(mall|department_store|supermarket|books|clothes|gift|convenience)$"]'],
      stay: ['["tourism"~"^(hotel|hostel|guest_house|motel)$"]']
    };
    SEL.top = [].concat(SEL.food, SEL.cafe, SEL.park, SEL.sights);
    const CHIPS = [['top','✨ Top picks'],['food','🍽️ Food'],['cafe','☕ Cafés'],['bar','🍺 Bars'],['park','🌳 Parks'],['sights','🏛️ Sights'],['shop','🛍️ Shops'],['stay','🛏️ Stay']];

    function classify(t) {
      const a = t.amenity, tr = t.tourism, l = t.leisure;
      let em = '📍';
      if (['restaurant','fast_food','food_court'].includes(a)) em = '🍽️';
      else if (a === 'cafe' || a === 'ice_cream' || t.shop === 'bakery') em = '☕';
      else if (['bar','pub','biergarten'].includes(a)) em = '🍺';
      else if (l) em = '🌳';
      else if (['hotel','hostel','guest_house','motel'].includes(tr)) em = '🛏️';
      else if (tr || t.historic) em = '🏛️';
      else if (t.shop) em = '🛍️';
      const label = String(a || tr || l || t.historic || t.shop || 'place').replace(/_/g, ' ');
      return [em, label];
    }
    function score(p) {
      const t = p.tags; let s = 0;
      if (t.wikipedia || t.wikidata) s += 3;
      if (t.website || t['contact:website']) s += 1;
      if (t.opening_hours) s += 0.7;
      if (t.phone || t['contact:phone']) s += 0.5;
      if (t.cuisine) s += 0.4;
      if (t.image || t.wikimedia_commons) s += 1;
      s += (avgRating(p.key) || 0) * 0.4;
      return s - (p.dist / 1000) * 1.2;
    }
    async function overpass(q) {
      const eps = ['https://overpass-api.de/api/interpreter', 'https://overpass.kumi.systems/api/interpreter'];
      for (const ep of eps) {
        try {
          const r = await fetch(ep, { method: 'POST', body: 'data=' + encodeURIComponent(q) });
          if (r.ok) return await r.json();
        } catch (e) {}
      }
      throw new Error('overpass');
    }
    async function fetchPlaces(c, category) {
      for (const radius of [1500, 4000]) {
        const parts = SEL[category].map(s => 'nwr' + s + '["name"](around:' + radius + ',' + c.lat + ',' + c.lng + ');').join('');
        const j = await overpass('[out:json][timeout:25];(' + parts + ');out center tags 100;');
        const out = [];
        const seen = new Set();
        for (const el of j.elements) {
          const lat = el.lat != null ? el.lat : el.center && el.center.lat;
          const lon = el.lon != null ? el.lon : el.center && el.center.lon;
          if (lat == null || !el.tags || !el.tags.name) continue;
          const key = 'osm/' + el.type + '/' + el.id;
          if (seen.has(key)) continue; seen.add(key);
          const cl = classify(el.tags);
          out.push({ key, name: el.tags.name, lat, lon, tags: el.tags, em: cl[0], label: cl[1], dist: L.latLng(c.lat, c.lng).distanceTo([lat, lon]) });
        }
        if (out.length >= 5 || radius === 4000) {
          out.forEach(p => p.score = score(p));
          const ranked = out.sort((a, b) => b.score - a.score).slice(0, 25);
          ranked.forEach((p, i) => { p.rec = i < 5 || avgRating(p.key) >= 4; });
          return ranked;
        }
      }
      return [];
    }
    function renderChips() {
      $('#chips').innerHTML = CHIPS.map(c => '<button class="chip' + (c[0] === cat ? ' on' : '') + '" data-c="' + c[0] + '">' + c[1] + '</button>').join('');
    }
    $('#chips').addEventListener('click', e => {
      const b = e.target.closest('.chip'); if (!b) return;
      cat = b.dataset.c; renderChips(); runExplore();
    });
    function pinIcon(em, rec) { return L.divIcon({ className: '', html: '<div class="pin">' + em + (rec ? '<span class="rec">😋</span>' : '') + '</div>', iconSize: [30, 30], iconAnchor: [15, 15] }); }

    async function runExplore() {
      const m = map.getCenter();
      const c = exploreCenter || userLatLng || { lat: m.lat, lng: m.lng };
      exploreCenter = c;
      renderChips();
      placesLayer.clearLayers();
      $('#list').innerHTML = '<div class="empty">Finding places…</div>';
      try {
        places = await fetchPlaces(c, cat);
      } catch (e) {
        $('#list').innerHTML = '<div class="empty">Couldn’t load places right now. <button class="b" id="retry">Retry</button></div>';
        $('#retry').onclick = runExplore; return;
      }
      if (!places.length) { $('#list').innerHTML = '<div class="empty">Nothing found here for this category. Try another.</div>'; return; }
      $('#list').innerHTML = places.map((p, i) => {
        const r = avgRating(p.key);
        return '<div class="item" data-i="' + i + '"><div class="em">' + p.em + '</div><div><div class="nm">' + esc(p.name) + (p.rec ? ' <span class="recTag">😋 Recommended</span>' : '') + '</div><div class="sm">' + esc(p.label) + ' · ' + fmtDist(p.dist) + (r ? ' · ★ ' + r.toFixed(1) : '') + '</div></div></div>';
      }).join('');
      places.forEach(p => L.marker([p.lat, p.lon], { icon: pinIcon(p.em, p.rec), zIndexOffset: p.rec ? 500 : 0 }).on('click', () => openPlace(p)).addTo(placesLayer));
    }
    $('#list').addEventListener('click', e => {
      const it = e.target.closest('.item'); if (it) openPlace(places[+it.dataset.i]);
    });
    $('#searchHere').addEventListener('click', () => {
      const m = map.getCenter();
      if (map.getZoom() < 10) { showTab('explore'); statusEl.textContent = 'Zoom in closer, then tap 🔄 again.'; return; }
      exploreCenter = { lat: m.lat, lng: m.lng, label: 'map' };
      statusEl.textContent = 'Showing picks around the map center.';
      showTab('explore'); loadWeather(m.lat, m.lng); runExplore();
    });

    /* ---------- Tabs / sheet ---------- */
    function showTab(n) {
      ['explore', 'saved', 'place'].forEach(t => {
        $('#tab-' + t).hidden = t !== n;
        document.querySelector('[data-tab="' + t + '"]').classList.toggle('on', t === n);
      });
      if (n === 'saved') renderSaved();
      $('#sheet').classList.remove('min');
    }
    $('#tabs').addEventListener('click', e => { const b = e.target.closest('[data-tab]'); if (b) showTab(b.dataset.tab); });
    $('#grab').addEventListener('click', () => $('#sheet').classList.toggle('min'));

    /* ---------- Saved places ---------- */
    function renderSaved() {
      const s = Object.values(store.get('saved', {}));
      const box = $('#tab-saved');
      if (!s.length) { box.innerHTML = '<div class="empty">No saved places yet. Open a place and tap ☆ Save.</div>'; return; }
      box.innerHTML = s.map((p, i) => '<div class="item" data-i="' + i + '"><div class="em">' + (p.em || '📍') + '</div><div><div class="nm">' + esc(p.name) + '</div><div class="sm">' + esc(p.label || '') + '</div></div></div>').join('');
      box.onclick = e => { const it = e.target.closest('.item'); if (it) openPlace(s[+it.dataset.i]); };
    }

    /* ---------- Reviews (stored on this device) ---------- */
    const getRevs = k => (store.get('reviews', {})[k] || []);
    function avgRating(k) { const r = getRevs(k); return r.length ? r.reduce((a, x) => a + x.s, 0) / r.length : 0; }
    const starStr = n => '★'.repeat(Math.round(n)) + '☆'.repeat(5 - Math.round(n));

    /* ---------- Place details ---------- */
    function addrOf(t) {
      if (t.addr) return t.addr;
      const l1 = [t['addr:housenumber'], t['addr:street']].filter(Boolean).join(' ');
      return [l1, t['addr:city'], t['addr:postcode']].filter(Boolean).join(', ');
    }
    function placeUrls(p) {
      return {
        dir: 'https://www.google.com/maps/dir/?api=1&destination=' + p.lat + ',' + p.lon,
        g: 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(p.name + ' ') + p.lat + ',' + p.lon
      };
    }
    function infoRows(t, p) {
      const rows = [];
      const a = addrOf(t); if (a) rows.push(['Address', esc(a)]);
      if (t.opening_hours) rows.push(['Hours', esc(t.opening_hours)]);
      const ph = t.phone || t['contact:phone']; if (ph) rows.push(['Phone', '<a href="tel:' + esc(ph.replace(/[^\d+]/g, '')) + '">' + esc(ph) + '</a>']);
      const w = safeUrl(t.website || t['contact:website']); if (w) rows.push(['Website', '<a href="' + esc(w) + '" target="_blank" rel="noopener">' + esc(w.replace(/^https?:\/\/(www\.)?/, '').slice(0, 40)) + '</a>']);
      if (t.cuisine) rows.push(['Cuisine', esc(t.cuisine.replace(/[;_]/g, ' · '))]);
      if (t.wheelchair) rows.push(['Wheelchair', esc(t.wheelchair)]);
      rows.push(['Coordinates', p.lat.toFixed(5) + ', ' + p.lon.toFixed(5)]);
      return rows.map(r => '<dt>' + r[0] + '</dt><dd>' + r[1] + '</dd>').join('');
    }

    function renderReviews() {
      const p = cur, revs = getRevs(p.key);
      const avg = revs.length ? revs.reduce((a, x) => a + x.s, 0) / revs.length : 0;
      $('#revSummary').innerHTML = revs.length ? '<span class="stars">' + starStr(avg) + '</span> ' + avg.toFixed(1) + ' · ' + revs.length + ' review' + (revs.length > 1 ? 's' : '') : '<span class="sub">No reviews yet. Be the first.</span>';
      $('#revList').innerHTML = revs.map(r => '<div class="rev"><span class="stars">' + starStr(r.s) + '</span> <b>' + esc(r.n) + '</b> <span class="meta">' + new Date(r.d).toLocaleDateString() + '</span>' + (r.t ? '<div>' + esc(r.t) + '</div>' : '') + '</div>').join('');
    }

    async function openPlace(p, fly) {
      cur = p; showTab('place');
      selLayer.clearLayers();
      L.marker([p.lat, p.lon]).addTo(selLayer);
      if (fly !== false) focusOn(p.lat, p.lon, Math.max(map.getZoom(), 16));
      const t = p.tags || {}, u = placeUrls(p);
      const saved = !!store.get('saved', {})[p.key];
      $('#tab-place').innerHTML =
        '<div class="ph"><h2>' + esc(p.name) + '</h2>' + (p.rec ? '<div class="recTag big">😋 Recommended for you</div>' : '') + '<div class="sub">' + esc(p.label || '') + (p.dist != null ? ' · ' + fmtDist(p.dist) + ' away' : '') + '</div></div>' +
        '<div class="actions"><button class="b" data-act="save">' + (saved ? '★ Saved' : '☆ Save') + '</button>' +
        '<a class="b pri" href="' + esc(u.dir) + '" target="_blank" rel="noopener">➜ Directions</a>' +
        '<a class="b" href="' + esc(u.g) + '" target="_blank" rel="noopener">Google Maps</a>' +
        '<button class="b" data-act="nearby">Explore nearby</button><button class="b" data-act="share">Share</button></div>' +
        '<div class="gallery" id="gallery"></div><div class="credit" id="credit"></div>' +
        '<div id="gsec"></div><div id="wiki"></div>' +
        '<dl class="info">' + infoRows(t, p) + '</dl>' +
        '<h3>Reviews <span class="sub">(saved on this device)</span></h3><div id="revSummary"></div><div id="revList"></div>' +
        '<form id="revForm"><div id="starPick">' + [1,2,3,4,5].map(n => '<button type="button" data-s="' + n + '">★</button>').join('') + '</div>' +
        '<input id="revName" maxlength="40" placeholder="Your name (optional)"><textarea id="revText" rows="3" maxlength="500" placeholder="Write a review…"></textarea>' +
        '<button class="b pri" type="submit" style="margin-top:8px">Post review</button></form>';
      renderReviews();
      wirePlace(p);
      loadPhotosAndInfo(p);
    }

    function wirePlace(p) {
      let rating = 0;
      $('#starPick').onclick = e => {
        const b = e.target.closest('button'); if (!b) return;
        rating = +b.dataset.s;
        document.querySelectorAll('#starPick button').forEach(x => x.classList.toggle('on', +x.dataset.s <= rating));
      };
      $('#revForm').onsubmit = e => {
        e.preventDefault();
        if (!rating) { alert('Tap a star rating first.'); return; }
        const all = store.get('reviews', {});
        (all[p.key] = all[p.key] || []).unshift({ n: $('#revName').value.trim() || 'Anonymous', s: rating, t: $('#revText').value.trim(), d: Date.now() });
        store.set('reviews', all);
        $('#revText').value = ''; rating = 0;
        document.querySelectorAll('#starPick button').forEach(x => x.classList.remove('on'));
        renderReviews();
      };
      $('#tab-place').querySelector('.actions').onclick = async e => {
        const b = e.target.closest('[data-act]'); if (!b) return;
        if (b.dataset.act === 'save') {
          const s = store.get('saved', {});
          if (s[p.key]) { delete s[p.key]; b.textContent = '☆ Save'; }
          else { s[p.key] = { key: p.key, name: p.name, lat: p.lat, lon: p.lon, tags: p.tags, em: p.em, label: p.label, rec: p.rec }; b.textContent = '★ Saved'; }
          store.set('saved', s);
        } else if (b.dataset.act === 'nearby') {
          exploreCenter = { lat: p.lat, lng: p.lon, label: p.name };
          statusEl.textContent = 'Showing picks around ' + p.name + '.';
          showTab('explore'); loadWeather(p.lat, p.lon); runExplore();
        } else if (b.dataset.act === 'share') {
          const url = placeUrls(p).g;
          try {
            if (navigator.share) await navigator.share({ title: p.name, url });
            else { await navigator.clipboard.writeText(url); b.textContent = 'Link copied'; }
          } catch (err) {}
        }
      };
    }

    function addPhotos(list, credit) {
      const g = $('#gallery'); if (!g || !list.length) return;
      list.forEach(src => {
        const img = document.createElement('img');
        img.loading = 'lazy'; img.alt = ''; img.src = src;
        img.onerror = () => img.remove();
        g.appendChild(img);
      });
      const c = $('#credit'); if (c && credit && !c.textContent.includes(credit)) c.textContent += (c.textContent ? ' · ' : '') + credit;
    }

    async function loadPhotosAndInfo(p) {
      const t = p.tags || {}, mine = p.key;
      const stillHere = () => cur && cur.key === mine;
      // 1) photo links from OSM tags
      const direct = [];
      if (safeUrl(t.image)) direct.push(t.image);
      if (t.wikimedia_commons && /^File:/i.test(t.wikimedia_commons)) direct.push('https://commons.wikimedia.org/wiki/Special:FilePath/' + encodeURIComponent(t.wikimedia_commons.replace(/^File:/i, '')) + '?width=500');
      addPhotos(direct, 'Photos: OpenStreetMap / Wikimedia');
      // 2) Wikipedia summary
      if (t.wikipedia && t.wikipedia.includes(':')) {
        try {
          const i = t.wikipedia.indexOf(':'), lang = t.wikipedia.slice(0, i), title = t.wikipedia.slice(i + 1);
          const j = await (await fetch('https://' + encodeURIComponent(lang) + '.wikipedia.org/api/rest_v1/page/summary/' + encodeURIComponent(title))).json();
          if (stillHere() && j.extract) {
            const link = j.content_urls && safeUrl(j.content_urls.desktop.page);
            $('#wiki').innerHTML = '<div class="box">' + esc(j.extract.length > 420 ? j.extract.slice(0, 420) + '…' : j.extract) + (link ? ' <a href="' + esc(link) + '" target="_blank" rel="noopener">Wikipedia</a>' : '') + '</div>';
            if (j.thumbnail && j.thumbnail.source) addPhotos([j.thumbnail.source], 'Photos: Wikipedia');
          }
        } catch (e) {}
      }
      // 3) Wikimedia Commons photos taken near here
      try {
        const u = 'https://commons.wikimedia.org/w/api.php?action=query&generator=geosearch&ggscoord=' + p.lat + '%7C' + p.lon + '&ggsradius=120&ggsnamespace=6&ggslimit=8&prop=imageinfo&iiprop=url&iiurlwidth=400&format=json&origin=*';
        const j = await (await fetch(u)).json();
        if (stillHere() && j.query) {
          const imgs = Object.values(j.query.pages).map(x => x.imageinfo && x.imageinfo[0] && x.imageinfo[0].thumburl).filter(s => s && /\.(jpe?g|png|webp)/i.test(s));
          addPhotos(imgs.slice(0, 6), 'Nearby photos: Wikimedia Commons');
        }
      } catch (e) {}
      // 4) Google Places (only if the user added an API key)
      const key = store.get('gkey', '');
      if (key) {
        try {
          const r = await fetch('https://places.googleapis.com/v1/places:searchText', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'X-Goog-Api-Key': key, 'X-Goog-FieldMask': 'places.displayName,places.rating,places.userRatingCount,places.googleMapsUri,places.photos,places.reviews,places.formattedAddress' },
            body: JSON.stringify({ textQuery: p.name, locationBias: { circle: { center: { latitude: p.lat, longitude: p.lon }, radius: 200 } }, maxResultCount: 1 })
          });
          const j = await r.json();
          if (!stillHere()) return;
          if (j.error) { $('#gsec').innerHTML = '<div class="box">Google: ' + esc(j.error.message) + '</div>'; return; }
          const g = j.places && j.places[0];
          if (!g) { $('#gsec').innerHTML = '<div class="box">No Google match found for this place.</div>'; return; }
          const link = safeUrl(g.googleMapsUri);
          let h = '<div class="box"><b>Google</b> · ' + (g.rating ? '<span class="stars">' + starStr(g.rating) + '</span> ' + g.rating + ' (' + (g.userRatingCount || 0) + ')' : 'no rating') + (link ? ' · <a href="' + esc(link) + '" target="_blank" rel="noopener">View on Google Maps</a>' : '');
          (g.reviews || []).slice(0, 5).forEach(rv => {
            h += '<div class="rev"><span class="stars">' + starStr(rv.rating || 0) + '</span> <b>' + esc(rv.authorAttribution && rv.authorAttribution.displayName) + '</b> <span class="meta">' + esc(rv.relativePublishTimeDescription || '') + '</span><div>' + esc(rv.text && rv.text.text) + '</div></div>';
          });
          $('#gsec').innerHTML = h + '</div>';
          addPhotos((g.photos || []).slice(0, 6).map(ph => 'https://places.googleapis.com/v1/' + ph.name + '/media?maxWidthPx=500&key=' + encodeURIComponent(key)), 'Photos: Google');
        } catch (e) { if (stillHere()) $('#gsec').innerHTML = '<div class="box">Couldn’t reach Google Places.</div>'; }
      }
      if (stillHere() && !$('#gallery').children.length) $('#credit').textContent = 'No photos found for this place.';
    }

    $('#gear').addEventListener('click', () => {
      const v = prompt('Optional: paste a Google Maps Platform API key (Places API New enabled) to show Google photos and reviews. Leave blank to remove.', store.get('gkey', ''));
      if (v !== null) { store.set('gkey', v.trim()); if (cur) openPlace(cur, false); }
    });

    /* ---------- Search (Nominatim) ---------- */
    const resultsEl = $('#results');
    $('#searchForm').addEventListener('submit', async e => {
      e.preventDefault();
      const q = $('#q').value.trim(); if (!q) return;
      resultsEl.hidden = false; resultsEl.innerHTML = '<div class="res">Searching…</div>';
      try {
        const j = await (await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&addressdetails=1&limit=6&q=' + encodeURIComponent(q))).json();
        if (!j.length) { resultsEl.innerHTML = '<div class="res">No results found.</div>'; return; }
        resultsEl.innerHTML = j.map((r, i) => {
          const parts = r.display_name.split(', ');
          return '<div class="res" data-i="' + i + '">' + esc(parts[0]) + '<small>' + esc(parts.slice(1, 4).join(', ')) + '</small></div>';
        }).join('');
        resultsEl.onclick = ev => {
          const it = ev.target.closest('.res'); if (!it || it.dataset.i == null) return;
          const r = j[+it.dataset.i];
          resultsEl.hidden = true;
          const lat = +r.lat, lon = +r.lon, bb = r.boundingbox && r.boundingbox.map(Number);
          const big = bb && (bb[1] - bb[0] > 0.02 || bb[3] - bb[2] > 0.02);
          const parts = r.display_name.split(', ');
          const p = { key: r.osm_type ? 'osm/' + r.osm_type + '/' + r.osm_id : 'll/' + lat.toFixed(5) + ',' + lon.toFixed(5), name: r.name || parts[0], lat, lon, tags: { addr: parts.slice(1).join(', ') }, em: '📍', label: String(r.type || r.category || 'place').replace(/_/g, ' ') };
          if (userLatLng) p.dist = L.latLng(userLatLng.lat, userLatLng.lng).distanceTo([lat, lon]);
          if (big) map.fitBounds([[bb[0], bb[2]], [bb[1], bb[3]]], { paddingBottomRight: [0, $('#sheet').offsetHeight] });
          openPlace(p, !big);
        };
      } catch (err) { resultsEl.innerHTML = '<div class="res">Search failed. Check your connection and try again.</div>'; }
    });
    document.addEventListener('click', e => { if (!e.target.closest('header')) resultsEl.hidden = true; });

    /* ---------- Measure tool ---------- */
    let measuring = false, mPts = [];
    const mLine = L.polyline([], { color: '#ff8a00', weight: 4, dashArray: '6 6' }).addTo(map);
    const mMarks = L.layerGroup().addTo(map);
    function updateMeasure() {
      mLine.setLatLngs(mPts);
      let total = 0; for (let i = 1; i < mPts.length; i++) total += mPts[i - 1].distanceTo(mPts[i]);
      $('#measureTxt').textContent = mPts.length < 2 ? '📏 Tap the map to add points' : '📏 ' + fmtDist(total);
      $('#measureChip').hidden = !measuring;
    }
    $('#measure').addEventListener('click', () => {
      measuring = !measuring;
      $('#measure').classList.toggle('on', measuring);
      map.getContainer().style.cursor = measuring ? 'crosshair' : '';
      if (!measuring) { mPts = []; mMarks.clearLayers(); }
      updateMeasure();
    });
    $('#measureClear').addEventListener('click', () => { mPts = []; mMarks.clearLayers(); updateMeasure(); });

    /* ---------- Tap the map ---------- */
    map.on('click', async event => {
      if (measuring) {
        mPts.push(event.latlng);
        L.circleMarker(event.latlng, { radius: 5, color: '#ff8a00', fillOpacity: 1 }).addTo(mMarks);
        updateMeasure(); return;
      }
      const { lat, lng } = event.latlng;
      const box = document.createElement('div');
      box.innerHTML = '<b>Selected location</b><br>Latitude: ' + lat.toFixed(4) + '°<br>Longitude: ' + lng.toFixed(4) + '°<div id="rg" style="color:#555;margin-top:4px">Looking up address…</div><div class="pop-btns"><button data-a="d">Details</button><button data-a="e">Explore here</button></div>';
      const pop = L.popup().setLatLng(event.latlng).setContent(box).openOn(map);
      let p = { key: 'll/' + lat.toFixed(5) + ',' + lng.toFixed(5), name: 'Dropped pin', lat, lon: lng, tags: {}, em: '📍', label: 'location' };
      try {
        const r = await (await fetch('https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=18&lat=' + lat + '&lon=' + lng)).json();
        if (r && r.display_name) {
          const parts = r.display_name.split(', ');
          p = { key: r.osm_type ? 'osm/' + r.osm_type + '/' + r.osm_id : p.key, name: r.name || parts[0], lat, lon: lng, tags: { addr: parts.slice(1).join(', ') }, em: '📍', label: String(r.type || 'location').replace(/_/g, ' ') };
          box.querySelector('#rg').textContent = r.display_name;
        } else box.querySelector('#rg').textContent = '';
      } catch (e) { box.querySelector('#rg').textContent = ''; }
      if (userLatLng) p.dist = L.latLng(userLatLng.lat, userLatLng.lng).distanceTo([lat, lng]);
      box.querySelector('.pop-btns').onclick = ev => {
        const a = ev.target.dataset.a; if (!a) return;
        map.closePopup();
        if (a === 'd') openPlace(p, false);
        else { exploreCenter = { lat, lng, label: 'pin' }; statusEl.textContent = 'Showing picks around your dropped pin.'; showTab('explore'); loadWeather(lat, lng); runExplore(); }
      };
    });

    /* ---------- Welcome tour (first visit) ---------- */
    const STEPS = [
      { hello: true, title: 'Hello There', tail: '👋', tailClass: 'wave', text: 'Welcome to Earth Explorer! Let me show you around. It takes about 20 seconds.' },
      { target: '#locate', em: '◎', title: 'Find yourself', text: 'Tap this to show where you are. I’ll then recommend places around you.' },
      { target: '#searchForm', em: '🔍', title: 'Search anything', text: 'Look up any city, address or place. You can also tap anywhere on the map to get its address.' },
      { target: '#sheet', em: '😋', title: 'Recommended picks', text: 'The best spots nearby show up here. Places marked with 😋 are my top recommendations.', extra: '<div class="sample"><span style="font-size:22px">☕</span><span>Corner Café <span class="recTag">😋 Recommended</span></span></div>' },
      { target: '.fabs', em: '📏', title: 'Handy tools', text: 'Measure distances with 📏, or tap 🔄 to get recommendations around wherever the map is centered.' },
      { target: '.leaflet-control-layers', em: '🗺️', title: 'Change the view', text: 'Switch between streets, satellite, terrain and dark mode.' },
      { hello: true, title: 'You’re all set', tail: '🚀', tailClass: 'bounceE', text: 'Tap ◎ to start exploring. Replay this tour anytime with the ? button.' }
    ];
    const tour = $('#tour'), spot = $('#spot'), tourCard = $('#tourCard'), tourBody = $('#tourBody');
    let tourI = 0;

    function titleHTML(text, tail, tailClass) {
      const letters = text.split('').map((ch, i) => ch === ' ' ? ' ' : '<span class="ltr" style="animation-delay:' + (i * 45) + 'ms">' + esc(ch) + '</span>').join('');
      return letters + (tail ? ' <span class="' + tailClass + '">' + tail + '</span>' : '');
    }
    function makeFloaties() {
      const set = ['🌍', '😋', '📍', '☕', '🌳', '🏛️', '🍽️', '⭐', '🗺️'];
      $('#floaties').innerHTML = Array.from({ length: 14 }, (_, i) =>
        '<span style="left:' + Math.round(Math.random() * 92) + '%;animation-duration:' + (6 + Math.random() * 6).toFixed(1) + 's;animation-delay:' + (Math.random() * 4).toFixed(1) + 's;font-size:' + (18 + Math.round(Math.random() * 18)) + 'px">' + set[i % set.length] + '</span>'
      ).join('');
    }
    function renderStep(i) {
      tourI = i;
      const s = STEPS[i];
      tour.classList.toggle('hello', !!s.hello);
      const el = s.target && document.querySelector(s.target);
      if (el) {
        const r = el.getBoundingClientRect();
        spot.style.left = (r.left - 6) + 'px'; spot.style.top = (r.top - 6) + 'px';
        spot.style.width = (r.width + 12) + 'px'; spot.style.height = (r.height + 12) + 'px';
        spot.style.opacity = 1;
        tourCard.className = (r.top + r.height / 2 > innerHeight / 2) ? 'at-top' : 'at-bottom';
      } else {
        spot.style.opacity = 0;
        tourCard.className = 'center';
      }
      tourBody.innerHTML = (s.hello ? '' : '<div class="stepEm">' + s.em + '</div>') +
        '<h2 class="tt">' + titleHTML(s.title, s.tail, s.tailClass) + '</h2><p>' + esc(s.text) + '</p>' + (s.extra || '');
      tourBody.style.animation = 'none'; void tourBody.offsetWidth; tourBody.style.animation = '';
      $('#dots').innerHTML = STEPS.map((_, j) => '<i' + (j === i ? ' class="on"' : '') + '></i>').join('');
      const last = i === STEPS.length - 1;
      $('#tourNext').textContent = last ? 'Let’s go 🚀' : i === 0 ? 'Show me around' : 'Next';
      $('#tourSkip').hidden = last;
    }
    function startTour() {
      $('#sheet').classList.remove('min');
      showTab('explore');
      makeFloaties();
      tour.hidden = false;
      renderStep(0);
    }
    function endTour() { tour.hidden = true; store.set('seen', true); }
    $('#tourNext').addEventListener('click', () => tourI >= STEPS.length - 1 ? endTour() : renderStep(tourI + 1));
    $('#tourSkip').addEventListener('click', endTour);
    $('#help').addEventListener('click', startTour);
    window.addEventListener('resize', () => { if (!tour.hidden) renderStep(tourI); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape' && !tour.hidden) endTour(); });

    renderChips();
    if (!store.get('seen', false)) setTimeout(startTour, 500);
  </script>
</body>
</html>
